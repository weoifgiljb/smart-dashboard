name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:
    secrets:
      SERVER_HOST:
        required: false
      SERVER_USER:
        required: false
      SERVER_SSH_KEY:
        required: false

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn clean package

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  wordlist-data:
    name: Default Wordlist Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 离线校验：确认后端加载的 default.txt 与已提交的原始词表
      # tools/wordlist-sources/default.source.txt 一致（词序、翻译、字段数、
      # 例句/音标覆盖率），不下载任何数据源。数据源漂移请走生成脚本而非手改。
      - name: Verify bundled wordlist
        run: node tools/build-default-wordlist.mjs --check

  deploy:
    name: Deploy to Server
    needs: [frontend, backend, wordlist-data]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

    steps:
      # 未配置部署 secrets 时，让这个 job 变成"跳过"而不是"失败"：
      # 否则每次 master 推送都会因 appleboy 的 "missing server host" 报红，
      # 让真正的代码检查淹没在噪音里。三个 secrets 配齐后无需改动本文件，
      # 部署会自动开始执行。
      - name: Check deploy secrets
        id: guard
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "部署 secrets 已配置，继续部署。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::未配置 SERVER_HOST / SERVER_USER / SERVER_SSH_KEY，已跳过部署。这是配置缺失，不是代码问题。"
          fi

      - name: Download Frontend Artifact
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Download Backend Artifact
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target

      - name: Deploy to Server via SSH
        if: steps.guard.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          script: |
            # Stop existing service
            # systemctl stop smart-dashboard || true

            # Backup old version
            mkdir -p /opt/smart-dashboard/backup
            mv /opt/smart-dashboard/backend.jar /opt/smart-dashboard/backup/backend_$(date +%Y%m%d).jar || true

            # Prepare directories
            mkdir -p /opt/smart-dashboard/frontend
            mkdir -p /opt/smart-dashboard/backend

      - name: Copy Files via SCP
        if: steps.guard.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          source: "dist/*,target/*.jar"
          target: "/tmp/smart-dashboard-deploy"

      - name: Finalize Deployment
        if: steps.guard.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          script: |
            # Move Frontend files
            rm -rf /var/www/smart-dashboard/*
            cp -r /tmp/smart-dashboard-deploy/dist/* /var/www/smart-dashboard/

            # Move Backend file
            mv /tmp/smart-dashboard-deploy/target/*.jar /opt/smart-dashboard/backend.jar

            # Cleanup
            rm -rf /tmp/smart-dashboard-deploy

            # Restart Service
            # systemctl restart smart-dashboard
            echo "Deployment Complete!"
